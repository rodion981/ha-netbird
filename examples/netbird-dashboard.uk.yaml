# Український нативний dashboard NetBird для Home Assistant без зовнішніх залежностей.
# Вставте цей файл у редактор сирої конфігурації dashboard.

title: NetBird
views:
  - title: NetBird
    path: netbird
    icon: mdi:vpn
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Огляд
            icon: mdi:view-dashboard-outline
          - type: markdown
            content: |-
              {% set netbird_entities = integration_entities("netbird") %}
              {% macro value(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Недоступно
                {%- elif states(entity_id) == 'unknown' -%}Невідомо
                {%- else -%}{{ states(entity_id) }}
                {%- endif -%}
              {%- endmacro %}
              {% set overview = namespace(peers=none, connected=none, networks=none, resources=none, enabled_resources=none, routers=none, enabled_routers=none) %}
              {% for entity_id in netbird_entities %}
                {% set device = device_id(entity_id) %}
                {% if device and device_attr(device, 'name') == 'NetBird account' %}
                  {% set key = state_attr(entity_id, 'netbird_key') %}
                  {% if key == 'peer_count' %}{% set overview.peers = entity_id %}{% endif %}
                  {% if key == 'connected_peer_count' %}{% set overview.connected = entity_id %}{% endif %}
                  {% if key == 'network_count' %}{% set overview.networks = entity_id %}{% endif %}
                  {% if key == 'resource_count' %}{% set overview.resources = entity_id %}{% endif %}
                  {% if key == 'enabled_resource_count' %}{% set overview.enabled_resources = entity_id %}{% endif %}
                  {% if key == 'router_count' %}{% set overview.routers = entity_id %}{% endif %}
                  {% if key == 'enabled_router_count' %}{% set overview.enabled_routers = entity_id %}{% endif %}
                {% endif %}
              {% endfor %}
              **🟢 {{ value(overview.connected) }} / {{ value(overview.peers) }} пірів підключено**

              🌐 Мережі: **{{ value(overview.networks) }}**

              📦 Ресурси: **{{ value(overview.enabled_resources) }} / {{ value(overview.resources) }} увімкнено**

              🧭 Маршрутизатори: **{{ value(overview.enabled_routers) }} / {{ value(overview.routers) }} увімкнено**

      - type: grid
        cards:
          - type: heading
            heading: Піри
            icon: mdi:lan-connect
          - type: markdown
            content: |-
              {% set netbird_entities = integration_entities("netbird") %}
              {% macro value(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Недоступно
                {%- elif states(entity_id) == 'unknown' -%}Невідомо
                {%- else -%}{{ states(entity_id) }}
                {%- endif -%}
              {%- endmacro %}
              {% macro short_time(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Недоступно
                {%- elif states(entity_id) == 'unknown' -%}Невідомо
                {%- else -%}
                  {%- set parsed = as_datetime(states(entity_id), none) -%}
                  {{- as_local(parsed).strftime('%d %b %H:%M') if parsed else states(entity_id) -}}
                {%- endif -%}
              {%- endmacro %}
              {% macro connection(entity_id) -%}
                {%- if not entity_id -%}❔ Невідомо
                {%- elif states(entity_id) == 'on' -%}🟢 Онлайн
                {%- elif states(entity_id) == 'off' -%}⚪ Офлайн
                {%- elif states(entity_id) == 'unavailable' -%}⚫ Недоступно
                {%- else -%}❔ Невідомо
                {%- endif -%}
              {%- endmacro %}
              {% macro toggle(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'on' -%}Так
                {%- elif states(entity_id) == 'off' -%}Ні
                {%- elif states(entity_id) == 'unavailable' -%}Недоступно
                {%- else -%}Невідомо
                {%- endif -%}
              {%- endmacro %}
              {% set peer_seeds = namespace(items=[]) %}
              {% for entity_id in netbird_entities %}
                {% if state_attr(entity_id, 'netbird_key') == 'connected' %}
                  {% set peer_seeds.items = peer_seeds.items + [entity_id] %}
                {% endif %}
              {% endfor %}
              {% set peer_rows = namespace(items=[]) %}
              {% for seed in peer_seeds.items %}
                {% set device = device_id(seed) %}
                {% set row = namespace(connected=seed, ip=none, seen=none, login=none, accessible=none, ssh=none, ephemeral=none, expired=none, approval=none) %}
                {% for entity_id in device_entities(device) %}
                  {% set key = state_attr(entity_id, 'netbird_key') %}
                  {% if key == 'ip_address' %}{% set row.ip = entity_id %}{% endif %}
                  {% if key == 'last_seen' %}{% set row.seen = entity_id %}{% endif %}
                  {% if key == 'last_login' %}{% set row.login = entity_id %}{% endif %}
                  {% if key == 'accessible_peers' %}{% set row.accessible = entity_id %}{% endif %}
                  {% if key == 'ssh_enabled' %}{% set row.ssh = entity_id %}{% endif %}
                  {% if key == 'ephemeral' %}{% set row.ephemeral = entity_id %}{% endif %}
                  {% if key == 'login_expired' %}{% set row.expired = entity_id %}{% endif %}
                  {% if key == 'approval_required' %}{% set row.approval = entity_id %}{% endif %}
                {% endfor %}
                {% set warnings = namespace(items=[]) %}
                {% if row.expired and is_state(row.expired, 'on') %}{% set warnings.items = warnings.items + ['⚠ Термін входу минув'] %}{% endif %}
                {% if row.approval and is_state(row.approval, 'on') %}{% set warnings.items = warnings.items + ['⚠ Потрібне схвалення'] %}{% endif %}
                {% set peer_name = device_attr(device, 'name') | default('Пір без назви', true) %}
                {% set activity = '`' ~ value(row.ip) ~ '` · Востаннє онлайн: ' ~ short_time(row.seen) ~ ' · Вхід: ' ~ short_time(row.login) %}
                {% set capabilities = 'Доступні піри: ' ~ value(row.accessible) ~ ' · SSH: ' ~ toggle(row.ssh) ~ ' · Ефемерний: ' ~ toggle(row.ephemeral) %}
                {% if warnings.items %}{% set capabilities = capabilities ~ ' · ' ~ warnings.items | join(' · ') %}{% endif %}
                {% set peer_rows.items = peer_rows.items + ['- ' ~ connection(row.connected) ~ ' · **' ~ peer_name ~ '**  \n  ' ~ activity ~ '  \n  ' ~ capabilities] %}
              {% endfor %}
              {% if peer_rows.items | count == 0 %}
              _Пірів не знайдено._
              {% else %}
              {{ peer_rows.items | join('\n\n') }}
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Мережі
            icon: mdi:lan
          - type: markdown
            content: |-
              {% set netbird_entities = integration_entities("netbird") %}
              {% macro value(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Недоступно
                {%- elif states(entity_id) == 'unknown' -%}Невідомо
                {%- else -%}{{ states(entity_id) }}
                {%- endif -%}
              {%- endmacro %}
              {% set network_seeds = namespace(items=[]) %}
              {% for entity_id in netbird_entities %}
                {% if state_attr(entity_id, 'netbird_key') == 'connected_routing_peers' %}
                  {% set network_seeds.items = network_seeds.items + [entity_id] %}
                {% endif %}
              {% endfor %}
              {% set network_rows = namespace(items=[]) %}
              {% for seed in network_seeds.items %}
                {% set device = device_id(seed) %}
                {% set row = namespace(resources=none, enabled_resources=none, routers=none, enabled_routers=none, connected=seed) %}
                {% for entity_id in device_entities(device) %}
                  {% set key = state_attr(entity_id, 'netbird_key') %}
                  {% if key == 'resource_count' %}{% set row.resources = entity_id %}{% endif %}
                  {% if key == 'enabled_resource_count' %}{% set row.enabled_resources = entity_id %}{% endif %}
                  {% if key == 'router_count' %}{% set row.routers = entity_id %}{% endif %}
                  {% if key == 'enabled_router_count' %}{% set row.enabled_routers = entity_id %}{% endif %}
                {% endfor %}
                {% set network_name = device_attr(device, 'name') | default('Мережа без назви', true) %}
                {% set details = 'Ресурси: **' ~ value(row.enabled_resources) ~ '/' ~ value(row.resources) ~ '** · Маршрутизатори: **' ~ value(row.enabled_routers) ~ '/' ~ value(row.routers) ~ '** · Підключені піри маршрутизації: **' ~ value(row.connected) ~ '**' %}
                {% set network_rows.items = network_rows.items + ['- **' ~ network_name ~ '**  \n  ' ~ details] %}
              {% endfor %}
              {% if network_rows.items | count == 0 %}
              _Мереж не знайдено._
              {% else %}
              {{ network_rows.items | join('\n\n') }}
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Мережеві ресурси
            icon: mdi:server-network
          - type: markdown
            content: |-
              {% set netbird_entities = integration_entities("netbird") %}
              {% macro value(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Недоступно
                {%- elif states(entity_id) == 'unknown' -%}Невідомо
                {%- else -%}{{ states(entity_id) }}
                {%- endif -%}
              {%- endmacro %}
              {% macro route_status(enabled, routing) -%}
                {%- if not enabled -%}❔ Невідомо
                {%- elif states(enabled) == 'off' -%}⏸ Вимкнено
                {%- elif states(enabled) == 'unavailable' -%}⚫ Недоступно
                {%- elif states(enabled) != 'on' -%}❔ Невідомо
                {%- elif not routing -%}❔ Стан маршрутизації невідомий
                {%- elif states(routing) == 'on' -%}🟢 Маршрутизується
                {%- elif states(routing) == 'off' -%}🔴 Немає підключеного маршрутизатора
                {%- elif states(routing) == 'unavailable' -%}⚫ Маршрутизація недоступна
                {%- else -%}❔ Стан маршрутизації невідомий
                {%- endif -%}
              {%- endmacro %}
              {% set resource_seeds = namespace(items=[]) %}
              {% for entity_id in netbird_entities %}
                {% if state_attr(entity_id, 'netbird_key') == 'resource_type' %}
                  {% set resource_seeds.items = resource_seeds.items + [entity_id] %}
                {% endif %}
              {% endfor %}
              {% set resource_rows = namespace(items=[]) %}
              {% for seed in resource_seeds.items %}
                {% set device = device_id(seed) %}
                {% set row = namespace(enabled=none, routing=none, address=none, type=seed) %}
                {% for entity_id in device_entities(device) %}
                  {% set key = state_attr(entity_id, 'netbird_key') %}
                  {% if key == 'enabled' %}{% set row.enabled = entity_id %}{% endif %}
                  {% if key == 'routing_available' %}{% set row.routing = entity_id %}{% endif %}
                  {% if key == 'address' %}{% set row.address = entity_id %}{% endif %}
                {% endfor %}
                {% set parent = device_attr(device, 'via_device_id') %}
                {% set resource_name = device_attr(device, 'name') | default('Ресурс без назви', true) %}
                {% set network_name = device_attr(parent, 'name') if parent else '—' %}
                {% set details = '`' ~ value(row.address) ~ '` · ' ~ value(row.type) ~ ' · ' ~ route_status(row.enabled, row.routing) %}
                {% set resource_rows.items = resource_rows.items + ['- **' ~ resource_name ~ '** · ' ~ network_name ~ '  \n  ' ~ details] %}
              {% endfor %}
              {% if resource_rows.items | count == 0 %}
              _Мережевих ресурсів не знайдено._
              {% else %}
              {{ resource_rows.items | join('\n\n') }}
              {% endif %}

