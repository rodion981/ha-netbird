# Native, dependency-free NetBird dashboard for Home Assistant.
# Paste this file into a dashboard's raw configuration editor.

title: NetBird
views:
  - title: NetBird
    path: netbird
    icon: mdi:vpn
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Overview / Огляд
            icon: mdi:view-dashboard-outline
          - type: markdown
            content: |-
              {% set netbird_entities = integration_entities("netbird") %}
              {% macro value(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Unavailable
                {%- elif states(entity_id) == 'unknown' -%}Unknown
                {%- else -%}{{ states(entity_id) }}
                {%- endif -%}
              {%- endmacro %}
              {% set overview = namespace(peers=none, connected=none, networks=none, resources=none, routers=none) %}
              {% for entity_id in netbird_entities %}
                {% set device = device_id(entity_id) %}
                {% if device and device_attr(device, 'name') == 'NetBird account' %}
                  {% set key = state_attr(entity_id, 'netbird_key') %}
                  {% if key == 'peer_count' %}{% set overview.peers = entity_id %}{% endif %}
                  {% if key == 'connected_peer_count' %}{% set overview.connected = entity_id %}{% endif %}
                  {% if key == 'network_count' %}{% set overview.networks = entity_id %}{% endif %}
                  {% if key == 'resource_count' %}{% set overview.resources = entity_id %}{% endif %}
                  {% if key == 'router_count' %}{% set overview.routers = entity_id %}{% endif %}
                {% endif %}
              {% endfor %}
              **{{ value(overview.connected) }} / {{ value(overview.peers) }} peers connected / пірів підключено**

              Networks / Мережі: **{{ value(overview.networks) }}** · Resources / Ресурси: **{{ value(overview.resources) }}** · Routers / Маршрутизатори: **{{ value(overview.routers) }}**

      - type: grid
        cards:
          - type: heading
            heading: Peers / Піри
            icon: mdi:lan-connect
          - type: markdown
            content: |-
              {% set netbird_entities = integration_entities("netbird") %}
              {% macro value(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Unavailable
                {%- elif states(entity_id) == 'unknown' -%}Unknown
                {%- else -%}{{ states(entity_id) }}
                {%- endif -%}
              {%- endmacro %}
              {% macro short_time(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Unavailable
                {%- elif states(entity_id) == 'unknown' -%}Unknown
                {%- else -%}
                  {%- set parsed = as_datetime(states(entity_id), none) -%}
                  {{- as_local(parsed).strftime('%d %b %H:%M') if parsed else states(entity_id) -}}
                {%- endif -%}
              {%- endmacro %}
              {% macro connection(entity_id) -%}
                {%- if not entity_id -%}❔ Unknown
                {%- elif states(entity_id) == 'on' -%}🟢 Online
                {%- elif states(entity_id) == 'off' -%}⚪ Offline
                {%- elif states(entity_id) == 'unavailable' -%}⚫ Unavailable
                {%- else -%}❔ Unknown
                {%- endif -%}
              {%- endmacro %}
              {% set peer_seeds = namespace(items=[]) %}
              {% for entity_id in netbird_entities %}
                {% if state_attr(entity_id, 'netbird_key') == 'connected' %}
                  {% set peer_seeds.items = peer_seeds.items + [entity_id] %}
                {% endif %}
              {% endfor %}
              {% set peer_rows = namespace(items=[]) %}
              {% for seed in peer_seeds.items %}
                {% set device = device_id(seed) %}
                {% set row = namespace(connected=seed, ip=none, seen=none, accessible=none, ssh=none, ephemeral=none, expired=none, approval=none) %}
                {% for entity_id in device_entities(device) %}
                  {% set key = state_attr(entity_id, 'netbird_key') %}
                  {% if key == 'ip_address' %}{% set row.ip = entity_id %}{% endif %}
                  {% if key == 'last_seen' %}{% set row.seen = entity_id %}{% endif %}
                  {% if key == 'accessible_peers' %}{% set row.accessible = entity_id %}{% endif %}
                  {% if key == 'ssh_enabled' %}{% set row.ssh = entity_id %}{% endif %}
                  {% if key == 'ephemeral' %}{% set row.ephemeral = entity_id %}{% endif %}
                  {% if key == 'login_expired' %}{% set row.expired = entity_id %}{% endif %}
                  {% if key == 'approval_required' %}{% set row.approval = entity_id %}{% endif %}
                {% endfor %}
                {% set flags = namespace(items=[]) %}
                {% if row.ssh and is_state(row.ssh, 'on') %}{% set flags.items = flags.items + ['SSH'] %}{% endif %}
                {% if row.ephemeral and is_state(row.ephemeral, 'on') %}{% set flags.items = flags.items + ['Ephemeral'] %}{% endif %}
                {% if row.expired and is_state(row.expired, 'on') %}{% set flags.items = flags.items + ['⚠ Login expired'] %}{% endif %}
                {% if row.approval and is_state(row.approval, 'on') %}{% set flags.items = flags.items + ['⚠ Approval required'] %}{% endif %}
                {% set peer_name = device_attr(device, 'name') | default('Unnamed peer', true) %}
                {% set details = '`' ~ value(row.ip) ~ '` · Seen: ' ~ short_time(row.seen) ~ ' · Accessible: ' ~ value(row.accessible) %}
                {% if flags.items %}{% set details = details ~ ' · ' ~ flags.items | join(' · ') %}{% endif %}
                {% set peer_rows.items = peer_rows.items + ['- ' ~ connection(row.connected) ~ ' · **' ~ peer_name ~ '**  \n  ' ~ details] %}
              {% endfor %}
              {% if peer_rows.items | count == 0 %}
              _No peer entities found / Пірів не знайдено._
              {% else %}
              {{ peer_rows.items | join('\n\n') }}
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Networks / Мережі
            icon: mdi:lan
          - type: markdown
            content: |-
              {% set netbird_entities = integration_entities("netbird") %}
              {% macro value(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Unavailable
                {%- elif states(entity_id) == 'unknown' -%}Unknown
                {%- else -%}{{ states(entity_id) }}
                {%- endif -%}
              {%- endmacro %}
              {% set network_seeds = namespace(items=[]) %}
              {% for entity_id in netbird_entities %}
                {% if state_attr(entity_id, 'netbird_key') == 'connected_routing_peers' %}
                  {% set network_seeds.items = network_seeds.items + [entity_id] %}
                {% endif %}
              {% endfor %}
              {% set network_rows = namespace(items=[]) %}
              {% for seed in network_seeds.items %}
                {% set device = device_id(seed) %}
                {% set row = namespace(resources=none, enabled_resources=none, routers=none, enabled_routers=none, connected=seed) %}
                {% for entity_id in device_entities(device) %}
                  {% set key = state_attr(entity_id, 'netbird_key') %}
                  {% if key == 'resource_count' %}{% set row.resources = entity_id %}{% endif %}
                  {% if key == 'enabled_resource_count' %}{% set row.enabled_resources = entity_id %}{% endif %}
                  {% if key == 'router_count' %}{% set row.routers = entity_id %}{% endif %}
                  {% if key == 'enabled_router_count' %}{% set row.enabled_routers = entity_id %}{% endif %}
                {% endfor %}
                {% set network_name = device_attr(device, 'name') | default('Unnamed network', true) %}
                {% set details = 'Resources: **' ~ value(row.enabled_resources) ~ '/' ~ value(row.resources) ~ '** · Routers: **' ~ value(row.enabled_routers) ~ '/' ~ value(row.routers) ~ '** · Connected routing peers: **' ~ value(row.connected) ~ '**' %}
                {% set network_rows.items = network_rows.items + ['- **' ~ network_name ~ '**  \n  ' ~ details] %}
              {% endfor %}
              {% if network_rows.items | count == 0 %}
              _No networks found / Мереж не знайдено._
              {% else %}
              {{ network_rows.items | join('\n\n') }}
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Network resources / Мережеві ресурси
            icon: mdi:server-network
          - type: markdown
            content: |-
              {% set netbird_entities = integration_entities("netbird") %}
              {% macro value(entity_id) -%}
                {%- if not entity_id -%}—
                {%- elif states(entity_id) == 'unavailable' -%}Unavailable
                {%- elif states(entity_id) == 'unknown' -%}Unknown
                {%- else -%}{{ states(entity_id) }}
                {%- endif -%}
              {%- endmacro %}
              {% macro route_status(enabled, routing) -%}
                {%- if not enabled -%}❔ Unknown
                {%- elif states(enabled) == 'off' -%}⏸ Disabled
                {%- elif states(enabled) == 'unavailable' -%}⚫ Unavailable
                {%- elif states(enabled) != 'on' -%}❔ Unknown
                {%- elif not routing -%}❔ Routing unknown
                {%- elif states(routing) == 'on' -%}🟢 Routed
                {%- elif states(routing) == 'off' -%}🔴 No connected router
                {%- elif states(routing) == 'unavailable' -%}⚫ Routing unavailable
                {%- else -%}❔ Routing unknown
                {%- endif -%}
              {%- endmacro %}
              {% set resource_seeds = namespace(items=[]) %}
              {% for entity_id in netbird_entities %}
                {% if state_attr(entity_id, 'netbird_key') == 'resource_type' %}
                  {% set resource_seeds.items = resource_seeds.items + [entity_id] %}
                {% endif %}
              {% endfor %}
              {% set resource_rows = namespace(items=[]) %}
              {% for seed in resource_seeds.items %}
                {% set device = device_id(seed) %}
                {% set row = namespace(enabled=none, routing=none, address=none, type=seed) %}
                {% for entity_id in device_entities(device) %}
                  {% set key = state_attr(entity_id, 'netbird_key') %}
                  {% if key == 'enabled' %}{% set row.enabled = entity_id %}{% endif %}
                  {% if key == 'routing_available' %}{% set row.routing = entity_id %}{% endif %}
                  {% if key == 'address' %}{% set row.address = entity_id %}{% endif %}
                {% endfor %}
                {% set parent = device_attr(device, 'via_device_id') %}
                {% set resource_name = device_attr(device, 'name') | default('Unnamed resource', true) %}
                {% set network_name = device_attr(parent, 'name') if parent else '—' %}
                {% set details = '`' ~ value(row.address) ~ '` · ' ~ value(row.type) ~ ' · ' ~ route_status(row.enabled, row.routing) %}
                {% set resource_rows.items = resource_rows.items + ['- **' ~ resource_name ~ '** · ' ~ network_name ~ '  \n  ' ~ details] %}
              {% endfor %}
              {% if resource_rows.items | count == 0 %}
              _No network resources found / Мережевих ресурсів не знайдено._
              {% else %}
              {{ resource_rows.items | join('\n\n') }}
              {% endif %}
