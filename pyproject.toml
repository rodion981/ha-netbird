[project]
name = "ha-netbird"
version = "0.1.0"
description = "Home Assistant custom integration for NetBird"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.9.3",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "pytest-homeassistant-custom-component>=0.13.300",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components.netbird"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff]
exclude = [".venv", ".venv-wsl"]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "ICN",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
files = ["custom_components/netbird", "tests"]
explicit_package_bases = true
